name: Sync fork

# Keeps this fork current with its upstream (deepseek-ai/deepseek-harness):
#
# - `resolve` finds the newest upstream `dsh-v*` tag.
# - `sync-master` merges upstream `master` into this fork's `master` and copies
#   that tag, so the fork holds every release ref.
#
# Nothing here starts a build: packaging was taken out of this workflow, so a
# new upstream release is only mirrored until someone starts a build by hand.
#
# Pushing with `FORK_SYNC_TOKEN` is required because upstream commits routinely
# touch .github/workflows/*, and the `workflows` scope cannot be requested
# through the YAML permissions key — hence no `permissions` block either.
on:
  schedule:
    # Every six hours, so a release is mirrored within that window.
    - cron: '0 2,8,14,20 * * *'
  workflow_dispatch:

concurrency:
  group: sync-fork
  cancel-in-progress: false

env:
  UPSTREAM: deepseek-ai/deepseek-harness

jobs:
  resolve:
    name: Resolve the newest release tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve
        id: resolve
        run: |
          set -euo pipefail
          tag=$(git ls-remote --tags --refs "https://github.com/${UPSTREAM}.git" 'dsh-v*' \
            | awk '{print $2}' | sed 's|refs/tags/||' | sort -V | tail -1)
          if [ -z "$tag" ]; then
            echo 'no upstream dsh-v* tag found' >&2
            exit 1
          fi
          case "$tag" in
            dsh-v*) ;;
            *) echo "${tag} is not a dsh-v* tag" >&2; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "newest upstream tag: $tag" >> "$GITHUB_STEP_SUMMARY"

  sync-master:
    name: Sync master and the release tag
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.FORK_SYNC_TOKEN || github.token }}
      - name: Merge upstream master and copy the release tag
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream "https://github.com/${UPSTREAM}.git"
          git fetch --no-tags upstream master
          if git merge-base --is-ancestor upstream/master HEAD; then
            echo 'master already contains upstream/master' >> "$GITHUB_STEP_SUMMARY"
          else
            # A conflicted merge fails this job on purpose: upstream history moved
            # in a way the fork's own commits cannot absorb automatically.
            git merge --no-edit upstream/master
            git push origin HEAD:master
            echo "master merged upstream $(git rev-parse --short upstream/master)" >> "$GITHUB_STEP_SUMMARY"
          fi
          git fetch --no-tags upstream "refs/tags/${TAG}:refs/tags/${TAG}"
          git push origin "refs/tags/${TAG}"
          echo "tag ${TAG} is available in the fork" >> "$GITHUB_STEP_SUMMARY"
