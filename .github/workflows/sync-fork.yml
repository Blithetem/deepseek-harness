name: Sync fork

# Keeps this fork current with its upstream (deepseek-ai/deepseek-harness) and
# rebuilds the installer for every upstream release:
#
# - `resolve` finds the newest upstream `dsh-v*` tag and skips the build when the
#   rolling release already records that tag, so the permanent download URL
#   always carries the newest official release rather than an unreleased commit.
# - `sync-master` merges upstream `master` into this fork's `master` and copies
#   the release tag, so the fork holds the ref the build checks out.
# - `build-release` dispatches the packaging workflow with the tag as its source
#   ref; that workflow publishes the fixed-name asset of the
#   `desktop-unsigned-latest` release.
#
# A push made with the default `GITHUB_TOKEN` starts no other workflow, so the
# packaging run is dispatched explicitly (`workflow_dispatch` is the documented
# exception). Nothing here needs a personal access token.
on:
  schedule:
    # Every six hours, so a release is picked up within that window.
    - cron: '0 2,8,14,20 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: Upstream dsh-v* tag to build; empty uses the newest upstream tag
        type: string
        default: ''
      force:
        description: Build even when this fork already published that tag
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-fork
  cancel-in-progress: false

env:
  UPSTREAM: deepseek-ai/deepseek-harness
  RELEASE_TAG: desktop-unsigned-latest

jobs:
  resolve:
    name: Resolve the newest release tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      build: ${{ steps.resolve.outputs.build }}
    steps:
      - name: Resolve
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUESTED: ${{ inputs.tag }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED" ]; then
            tag="$REQUESTED"
          else
            tag=$(git ls-remote --tags --refs "https://github.com/${UPSTREAM}.git" 'dsh-v*' \
              | awk '{print $2}' | sed 's|refs/tags/||' | sort -V | tail -1)
          fi
          if [ -z "$tag" ]; then
            echo 'no upstream dsh-v* tag found' >&2
            exit 1
          fi
          case "$tag" in
            dsh-v*) ;;
            *) echo "${tag} is not a dsh-v* tag" >&2; exit 1 ;;
          esac
          version="${tag#dsh-v}"
          # The rolling release records the release it currently serves.
          published=$(gh release view "$RELEASE_TAG" --json body --jq .body 2>/dev/null \
            | sed -n 's/^Source tag: //p' | head -1 || true)
          if [ "$published" = "$tag" ] && [ "$FORCE" != 'true' ]; then
            build=false
            echo "already published ${tag}" >> "$GITHUB_STEP_SUMMARY"
          else
            build=true
            echo "building ${tag} (published: ${published:-none})" >> "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "build=$build"
          } >> "$GITHUB_OUTPUT"

  sync-master:
    name: Sync master and the release tag
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.FORK_SYNC_TOKEN || github.token }}
      - name: Merge upstream master and copy the release tag
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream "https://github.com/${UPSTREAM}.git"
          git fetch --no-tags upstream master
          if git merge-base --is-ancestor upstream/master HEAD; then
            echo 'master already contains upstream/master' >> "$GITHUB_STEP_SUMMARY"
          else
            # A conflicted merge fails this job on purpose: upstream history moved
            # in a way the fork's own commits cannot absorb automatically.
            git merge --no-edit upstream/master
            git push origin HEAD:master
            echo "master merged upstream $(git rev-parse --short upstream/master)" >> "$GITHUB_STEP_SUMMARY"
          fi
          # The build checks out this tag, so the fork needs the ref.
          git fetch --no-tags upstream "refs/tags/${TAG}:refs/tags/${TAG}"
          git push origin "refs/tags/${TAG}"
          echo "tag ${TAG} is available for the build checkout" >> "$GITHUB_STEP_SUMMARY"

  build-release:
    name: Start the installer build
    needs: [resolve, sync-master]
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Dispatch the packaging workflow
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          workflow_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows" --paginate \
            --jq '.workflows[] | select(.path == ".github/workflows/desktop-unsigned.yml") | .id')
          test -n "$workflow_id"
          jq -n --arg ref ci-desktop-unsigned --arg source "refs/tags/${TAG}" \
            --arg tag "$TAG" --arg version "$VERSION" \
            '{ref: $ref, inputs: {source_ref: $source, source_tag: $tag, build_version: $version}}' \
            | gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/dispatches" --input -
          echo "started desktop-unsigned.yml for ${TAG}" >> "$GITHUB_STEP_SUMMARY"
