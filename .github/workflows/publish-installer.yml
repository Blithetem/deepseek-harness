name: Publish unsigned installer

# Publishes the installer artifact of a finished "Desktop unsigned (Windows
# x64)" run as a GitHub Release, so the build has a stable download URL that
# needs no GitHub sign-in: releases of a public repository serve their assets
# anonymously.
#
# The runner downloads the artifact inside GitHub's network because a local
# `gh run download` of the same ~270 MB artifact stalls against the artifact
# endpoint from some networks.
#
# Dispatch it from master with the packaging run id and the release tag to
# publish. `run_id` accepts the run whose Artifacts section holds the installer;
# the version is part of the artifact name, not an input.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Run id of the Desktop unsigned run that holds the installer
        required: true
        type: string
      release_tag:
        description: Tag to publish; the release is created when the tag is new
        required: true
        type: string
      prerelease:
        description: Mark the release as a prerelease
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-installer-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish the installer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: installer
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout in this job, so gh cannot infer the repository from a
          # working tree.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.release_tag }}
          PRERELEASE: ${{ inputs.prerelease }}
          SOURCE_RUN: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          find installer -type f | sort
          mapfile -t assets < <(find installer -type f \( -name '*.exe' -o -name '*.blockmap' \) | sort)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "no installer assets in run ${SOURCE_RUN}" >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
            gh release edit "$TAG" --notes "Unsigned Windows x64 desktop test installer published from run ${SOURCE_RUN}."
          else
            flags=()
            if [ "$PRERELEASE" = 'true' ]; then flags+=(--prerelease); fi
            gh release create "$TAG" "${assets[@]}" \
              --title "$TAG" \
              --notes "Unsigned Windows x64 desktop test installer published from run ${SOURCE_RUN}." \
              "${flags[@]}"
          fi
          gh release view "$TAG" --json url,tagName,assets \
            --jq '"release \(.tagName): \(.url)", (.assets[] | "  \(.name) -> \(.url)")' > release.txt
          cat release.txt >> "$GITHUB_STEP_SUMMARY"
